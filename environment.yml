name: aimnet2
channels:
  - defaults
  - conda-forge
dependencies:
  - python>=3.10,<3.13
  - pip
  - jupyterlab
  - pip:
      - ase
      - pysisyphus
      - sella
      - orjson
      - git+https://github.com/McCoyGroup/McUtils.git
      - git+https://github.com/McCoyGroup/Psience.git
      - rdkit
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch==2.8.0
      - --find-links https://data.pyg.org/whl/torch-2.8.0+cpu.html
      - torch-cluster
      - pymatgen
      - aimnet
      - sella
